version = "1.0"

[verifier]
# FuseSoC + iverilog simulation is fast: each testbench compiles and runs in
# under 10 seconds. Five testbenches x 3x safety margin = ~5 min.
# Budget 15 min to be safe for slow environments.
timeout_sec = 900.0

[agent]
# Agents need time to understand the AES spec, implement 7 RTL modules, and
# iterate on failing tests. 24 h is the safe upper bound.
timeout_sec = 86400.0

[environment]
# iverilog compilation is lightweight; no heavy Verilator elaboration.
# FuseSoC workspace is small (a few MB). 2 CPUs and 4 GB RAM are ample.
build_timeout_sec = 600.0
cpus = 4
memory_mb = 4096
storage_mb = 8192
