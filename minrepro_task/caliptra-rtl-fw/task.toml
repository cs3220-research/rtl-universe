version = "1.0"

[verifier]
# Each Verilator simulation test requires firmware compile + simulation.
# This variant also strips firmware .c files so the agent must implement those.
# Expect fewer passing tests initially; 2h timeout.
timeout_sec = 7200.0

[agent]
# Agent needs more time since it must write both RTL and firmware.
timeout_sec = 86400.0

[environment]
# Same resource requirements as caliptra-rtl.
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 16384
storage_mb = 40960
