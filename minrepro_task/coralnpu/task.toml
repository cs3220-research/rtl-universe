version = "1.0"

[verifier]
# Warm-cache bazel test //... is ~10-15 min; allow generous headroom for slow targets.
timeout_sec = 3600.0

[agent]
# Agent has up to 3 h to implement the missing RTL/firmware.
timeout_sec = 10800.0

[environment]
# Image bakes ~30 GB of bazel cache and a host-compiled Verilator + firtool.
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 32768
storage_mb = 81920
