version = "1.0"

[verifier]
# Verilator elaboration of CVA6: ~10-15 min cold.
# E2E subset: ~79 tests (bare-metal integer, supervisor, AMO p-variant tests).
# Each test ~5-30s in simulation, so ~79 * 30s = ~40 min worst case.
# Budget: 15 min verilate + 45 min tests = 60 min. 3x safety = 3h.
timeout_sec = 10800.0

[agent]
# CVA6 is a full out-of-order RISC-V core. Even for the E2E subset,
# the agent needs to implement the entire core for any tests to pass.
# 24h is the standard upper bound for complex RTL tasks.
timeout_sec = 86400.0

[environment]
# Same resource requirements as the full cva6 task.
# Verilator compilation of CVA6 requires up to 8GB peak memory.
build_timeout_sec = 7200.0
cpus = 16
memory_mb = 32768
storage_mb = 65536
