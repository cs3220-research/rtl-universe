version = "1.0"

[verifier]
# Verilator model compilation + 10 smoke-test ASM tests.
# Warm model build ~15 min, 10 tests ~5 min. 3x warm = 60 min, add buffer.
timeout_sec = 3600.0

[agent]
# Agents get full 24 h even for the smoke variant.
timeout_sec = 86400.0

[environment]
# Same resource requirements as the full task (Verilator compilation is expensive).
build_timeout_sec = 7200.0
cpus = 8
memory_mb = 32768
storage_mb = 61440
