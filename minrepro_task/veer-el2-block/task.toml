version = "1.0"

[verifier]
# Block-level cocotb tests only via nox; no full-core Verilator build.
# Estimated: ~10 min warm per block * 22 blocks / 8 CPUs ~ 30 min.
timeout_sec = 2400.0

[agent]
# Agent has up to 24 h to restore the stripped RTL blocks.
timeout_sec = 86400.0

[environment]
# Lighter than full task — no top-level Verilator model or RISCOF.
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 16384
storage_mb = 40960
