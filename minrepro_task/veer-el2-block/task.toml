version = "1.0"

[verifier]
# The PyUVM IRQ test runs Verilator on the full VeeR EL2 core (~5-15 minutes
# to compile, ~5 minutes to simulate). Set 3x the measured time for safety.
timeout_sec = 7200.0

[agent]
# Agents need time to write the complete core RTL.
timeout_sec = 86400.0

[environment]
# Full chip Verilator compilation is very CPU and memory intensive.
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 32768
storage_mb = 32768
