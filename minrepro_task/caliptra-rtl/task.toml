version = "1.0"

[verifier]
# Each Verilator simulation test runs Verilator build + RISC-V firmware compile
# + simulation.  The warm Verilator binary is reused, but firmware must be
# compiled per-test.  ~53 tests x ~30-60s each, plus any rebuild time.
# Set to 2h to be safe; agent replaces RTL so Verilator must be rebuilt.
timeout_sec = 7200.0

[agent]
# Agent needs to restore RTL SV/V files and recompile with Verilator.
timeout_sec = 86400.0

[environment]
# Verilator compilation of this SoC (~500 SV files) peaks at ~8GB RAM.
# Storage for obj_dir + RISC-V toolchain + repo.
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 16384
storage_mb = 40960
