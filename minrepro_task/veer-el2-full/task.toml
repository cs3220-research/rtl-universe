version = "1.0"

[verifier]
# nox runs up to 48 block test sessions, each compiling with Verilator (60-120s
# per block) then running cocotb. With 8 CPUs, all sessions take ~60 minutes.
# Set 3x that for safety.
timeout_sec = 10800.0

[agent]
# Agents need time to write ~50 RTL modules and iterate on failures.
timeout_sec = 86400.0

[environment]
# Verilator compilation is CPU and memory intensive.
# 8 CPUs allows nox to run multiple sessions in parallel.
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 16384
storage_mb = 32768
