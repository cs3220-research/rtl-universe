version = "1.0"

[verifier]
# Verilator compile (~5-8 min cold) + 5 simulation runs.
# CS-register testbench + 4 simple-system SW tests.
# 15 min cold compile × 3 safety margin = 45 min.
timeout_sec = 2700.0

[agent]
# Agent has up to 24 h to implement the missing RTL + firmware.
timeout_sec = 86400.0

[environment]
allow_internet = false
# Verilator, RISC-V toolchain, FuseSoC, srecord — all apt-installed.
# No persistent build cache; each build is cold.
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 20480
