version = "1.0"

[verifier]
# Verilator compile of simple-system (~5-8 min) + 4 SW simulations.
# 15 min cold × 3 safety margin = 45 min.
timeout_sec = 2700.0

[agent]
# Agent has up to 24 h to implement the missing RTL + firmware.
timeout_sec = 86400.0

[environment]
# Verilator, RISC-V toolchain, FuseSoC, srecord — all apt-installed.
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 20480
