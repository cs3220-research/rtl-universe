# Block source code hosting domains to prevent agents from downloading
# the original implementation. Uses extra_hosts to sinkhole DNS.
# Harbor auto-appends this file to its docker-compose stack.
services:
  main:
    extra_hosts:
      - "github.com:0.0.0.0"
      - "raw.githubusercontent.com:0.0.0.0"
      - "api.github.com:0.0.0.0"
      - "objects.githubusercontent.com:0.0.0.0"
      - "codeload.github.com:0.0.0.0"
      - "gist.github.com:0.0.0.0"
      - "gitlab.com:0.0.0.0"
      - "bitbucket.org:0.0.0.0"
      - "codeberg.org:0.0.0.0"
      - "sr.ht:0.0.0.0"
      - "huggingface.co:0.0.0.0"
      - "hf.co:0.0.0.0"
      - "sourceforge.net:0.0.0.0"
