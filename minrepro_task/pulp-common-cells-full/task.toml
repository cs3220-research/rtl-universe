version = "1.0"

[verifier]
# Per-module Verilator lint: ~1 s per module x 65 modules = ~65 s.
# ECC C++ harness build + run: ~15 s each x 2 = ~30 s.
# Total warm-cache verifier time: ~2 min. Budget 15 min for safety.
timeout_sec = 900.0

[agent]
# Agent needs time to implement ~80 SystemVerilog modules.
# Each module is individually testable, so partial credit guides iteration.
# 24 h is the standard upper bound for complex RTL tasks.
timeout_sec = 86400.0

[environment]
# Verilator lint compilation is lightweight (no separate C++ compile step).
# ECC C++ harness is small. 4 CPUs and 8 GB RAM are ample.
# Storage: source ~10 MB + Bender dep cache ~50 MB + Verilator intermediates ~200 MB.
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 8192
