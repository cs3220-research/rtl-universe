version = "1.0"

[verifier]
# Verilator model compilation + CI regression test suite (ASM + AMO + MUL + FP + benchmarks).
# Measured: ~45 min cold build of Variane_testharness, then ~30 min for 228 tests.
# 3x warm budget = 2.5 h, rounded up.
timeout_sec = 10800.0

[agent]
# Agent has up to 24 h to restore stripped RTL.
timeout_sec = 86400.0

[environment]
# Verilator build of CVA6 is memory-heavy: ~2 GB peak during template expansion.
# Also needs RISCV toolchain (~1.5 GB), Spike build, and pre-built riscv-tests.
build_timeout_sec = 7200.0
cpus = 8
memory_mb = 32768
storage_mb = 81920
