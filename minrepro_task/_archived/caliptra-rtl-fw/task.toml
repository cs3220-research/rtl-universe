version = "1.0"

[verifier]
# E2E subset: 15 tests x ~60s each + Verilator rebuild (~10 min).
# Set to 2h to be safe.
timeout_sec = 7200.0

[agent]
# Agent needs to restore RTL SV/V files and rebuild with Verilator.
timeout_sec = 86400.0

[environment]
# Verilator compilation peaks at ~8GB RAM.
# Storage for obj_dir + RISC-V toolchain + repo.
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 16384
storage_mb = 40960
