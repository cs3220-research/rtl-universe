version = "1.0"

[verifier]
# 18 Icarus Verilog tests; each sim takes <30s. 3x buffer for agent iteration.
timeout_sec = 1800.0

[agent]
# 24 h — adequate for a multi-module Verilog restoration task.
timeout_sec = 86400.0

[environment]
# No warm cache needed — Icarus recompiles per-run. Build is fast (<5 min total).
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 20480
