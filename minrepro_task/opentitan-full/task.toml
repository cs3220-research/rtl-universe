version = "1.0"

[verifier]
# Host-side Bazel tests (cc_test + py_test) with warm cache:
#   - Bazel fetches/builds all external deps on first run (~5-10 min cold)
#   - With warm cache: bazel test takes ~3-5 min to compile impl + run ~131 tests
#   - Budget: 10 min compile + 10 min test = 20 min. 3x safety = 60 min.
timeout_sec = 3600.0

[agent]
# OpenTitan firmware is complex: DIF drivers, silicon_creator boot stack,
# base libraries. An agent needs time to implement all ~131 test targets.
# 24h is the standard upper bound for complex RTL+firmware tasks.
timeout_sec = 86400.0

[environment]
# Bazel fetches C++ toolchain and Python deps from bcr/external repos.
# Warm cache: bazel output_base stores compiled C++ objects and py libs.
# Storage: source ~150MB + Bazel cache ~3GB + toolchain ~500MB.
# Memory: Bazel + clang can peak at ~8GB during parallel cc_test builds.
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 16384
storage_mb = 40960
