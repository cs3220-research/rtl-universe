version = "1.0"

[verifier]
# E2E cocotb sims can take 100s+ each; 215 targets need ~3h with 8 CPUs.
timeout_sec = 10800.0

[agent]
# Agent has up to 24 h to implement the missing RTL/firmware.
timeout_sec = 86400.0

[environment]
allow_internet = false
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 32768
storage_mb = 81920
